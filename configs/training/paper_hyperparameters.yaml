provenance:
  status: verified_from_project_runbooks
  original_llamafactory_yaml_recovered: false
  note: >-
    These are the recorded paper-run values. The original LLaMA-Factory YAML
    files remain on an unavailable training host and must be compared before
    this file is promoted to an executable framework-specific config.

model: Qwen/Qwen3-VL-32B-Instruct

common:
  finetuning: lora
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  cutoff_len: 16384
  precision: bf16
  gradient_checkpointing: true
  seed: 42
  save_steps: 10
  freeze_vision_tower: true

sft:
  learning_rate: 2.0e-5
  num_train_epochs: 1.5

branchpo:
  implementation: standard_dpo_on_same_state_branch_pairs
  learning_rate: 7.0e-6
  num_train_epochs: 3.0
  beta: 0.05
  loss: sigmoid
  reference_policy: frozen_sft_checkpoint
  selected_sft_initialization_step: 30
